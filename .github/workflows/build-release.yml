name: Build Release APK

# 触发方式：
#   1. 在 GitHub 网页上 Actions → Build Release APK → Run workflow
#   2. 推送 v* 开头的 tag（自动创建 Release 并挂上 APK）
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名（如 1.0.1）'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 从 Secrets 还原签名密钥
        # 需要的 Secrets：
        #   KEYSTORE_BASE64       —— workpig-release.jks 的 base64 字符串
        #   KEYSTORE_PASSWORD     —— 密钥库密码
        #   KEY_ALIAS             —— 别名（如 workpig）
        #   KEY_PASSWORD          —— 密钥密码
        # 注意：Secrets 通过 env 注入，不直接内联进 shell 脚本（避免特殊字符被 shell 解释）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_V: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::缺少 KEYSTORE_BASE64，请在 Settings → Secrets and variables → Actions 中配置"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # 用 printf 逐行写入，避免 heredoc 缩进污染 properties 文件
          {
            printf 'RELEASE_STORE_FILE=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$KS_PASS"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS_V"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASS"
          } > keystore.properties
          chmod 600 keystore.properties "$RUNNER_TEMP/release.jks"
          echo "✓ 签名密钥已还原（别名：$KEY_ALIAS_V）"

      - name: 可选：覆盖版本名
        if: ${{ github.event.inputs.version_name != '' }}
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ github.event.inputs.version_name }}\"/" app/build.gradle
          echo "版本名已设为 ${{ github.event.inputs.version_name }}"

      - name: 构建 Release 签名包
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 校验签名
        run: |
          APK=$(find app/build/outputs/apk/release -name "*-release.apk" | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: 重命名并计算校验和
        run: |
          mkdir -p dist
          cp "$APK" "dist/打工人.apk"
          (cd dist && sha256sum 打工人.apk > 打工人.apk.sha256)
          cat dist/打工人.apk.sha256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 打工人-apk
          path: dist/*
          retention-days: 30

      - name: 打 tag 时自动创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/打工人.apk
            dist/打工人.apk.sha256
          generate_release_notes: true

      - name: 清理签名密钥
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
